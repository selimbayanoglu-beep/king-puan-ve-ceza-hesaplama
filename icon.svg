<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arka Plan Gradyanı -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>

    <!-- Lüks Altın Gradyanı -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Zümrüt Yeşili Gradyan -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Yakut Kırmızı Gradyan -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Parlama Filtresi -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arka Plan (iOS & Android Maskable Uyumlu) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.25"/>

  <!-- Köşe İskambil Sembolleri -->
  <!-- Maça ♠ -->
  <text x="56" y="86" font-size="34" fill="#94a3b8" text-anchor="middle" font-family="-apple-system, sans-serif" opacity="0.75">♠</text>
  <!-- Kupa ♥ -->
  <text x="456" y="86" font-size="34" fill="#fb7185" text-anchor="middle" font-family="-apple-system, sans-serif" opacity="0.85">♥</text>
  <!-- Karo ♦ -->
  <text x="56" y="456" font-size="34" fill="#fb7185" text-anchor="middle" font-family="-apple-system, sans-serif" opacity="0.85">♦</text>
  <!-- Sinek ♣ -->
  <text x="456" y="456" font-size="34" fill="#94a3b8" text-anchor="middle" font-family="-apple-system, sans-serif" opacity="0.75">♣</text>

  <!-- Arka Plan Işık Halesi -->
  <circle cx="256" cy="225" r="140" fill="#ca8a04" opacity="0.16" filter="url(#goldGlow)"/>

  <!-- KRAL TACIK (CHEVRON & GEMS) -->
  <g transform="translate(256, 215)" filter="url(#goldGlow)">
    <!-- Taç Tabanı -->
    <path d="M -140,75 L 140,75 L 120,95 L -120,95 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Taç Bant Detayları -->
    <rect x="-110" y="81" width="220" height="7" rx="3" fill="#0d1424" opacity="0.6"/>
    <!-- Küçük Taban Mücevherleri -->
    <circle cx="-75" cy="84.5" r="3.5" fill="url(#rubyGrad)"/>
    <circle cx="0" cy="84.5" r="4" fill="url(#emeraldGrad)"/>
    <circle cx="75" cy="84.5" r="3.5" fill="url(#rubyGrad)"/>

    <!-- Taç Gövdesi (5 Tepe) -->
    <path d="M -140,75 
             L -150,-15 
             L -85,32 
             L 0,-70 
             L 85,32 
             L 150,-15 
             L 140,75 Z" 
          fill="url(#goldGrad)" 
          stroke="#ca8a04" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Tepe Mücevherleri -->
    <!-- Sol Tepe -->
    <circle cx="-150" cy="-18" r="11" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <circle cx="-150" cy="-18" r="6" fill="url(#rubyGrad)"/>

    <!-- Orta Sol Tepe İçi -->
    <circle cx="-75" cy="40" r="7" fill="url(#emeraldGrad)"/>

    <!-- Orta Zirve Tepe -->
    <circle cx="0" cy="-75" r="17" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="0" cy="-75" r="10" fill="url(#rubyGrad)"/>
    <!-- Taç Haçı / Pırlanta -->
    <polygon points="0,-102 -4,-92 0,-84 4,-92" fill="#fff1a8"/>

    <!-- Orta Sağ Tepe İçi -->
    <circle cx="75" cy="40" r="7" fill="url(#emeraldGrad)"/>

    <!-- Sağ Tepe -->
    <circle cx="150" cy="-18" r="11" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <circle cx="150" cy="-18" r="6" fill="url(#rubyGrad)"/>

    <!-- Taç Üzeri Oyma Detay -->
    <path d="M 0,-45 L -45,25 L 45,25 Z" fill="#0d1424" opacity="0.25"/>
    <polygon points="0,-35 -15,15 15,15" fill="url(#rubyGrad)" opacity="0.9"/>
  </g>

  <!-- Yazı: KING -->
  <text x="256" y="375" 
        font-family="'Cinzel', 'Times New Roman', Georgia, serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="12" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        filter="url(#goldGlow)">KING</text>

  <!-- Alt Başlık: PUAN & ÇETELE -->
  <text x="256" y="415" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#38bdf8" 
        text-anchor="middle" 
        opacity="0.95">PUAN &amp; ÇETELE</text>
</svg>
